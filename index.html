<!DOCTYPE html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyPension</title>
<meta name="description" content="MyPension — simulateur de prévoyance suisse (3a, LPP, AVS, retraite) / Swiss pension planner">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyPension">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="chart.umd.min.js"></script>
<script src="params-2026.js"></script>
<script src="tax-tables-2026.js"></script>
<script src="config.js" onerror="window.MYPENSION_CONFIG=window.MYPENSION_CONFIG||{}"></script>
<style>
:root{
  --bg:#0b1020; --bg2:#111831; --card:#151d38; --card2:#1b2546; --line:#26315a;
  --txt:#e8ecf8; --mut:#8e9ac0; --acc:#6c8cff; --acc2:#9b6cff;
  --pos:#2fd08a; --neg:#ff5c7a; --warn:#ffb547; --shadow:0 10px 30px rgba(0,0,0,.35);
  --inp:#0f1630;
}
[data-theme=light]{
  --bg:#f3f5fb; --bg2:#e9edf7; --card:#ffffff; --card2:#f6f8fd; --line:#dfe4f1;
  --txt:#18203a; --mut:#66708f; --acc:#4361ee; --acc2:#7b4dff;
  --pos:#109a5f; --neg:#d93556; --warn:#c77700; --shadow:0 8px 24px rgba(30,40,80,.08);
  --inp:#f3f5fb;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 10% -10%,rgba(108,140,255,.18),transparent 60%),
             radial-gradient(900px 500px at 100% 0%,rgba(155,108,255,.14),transparent 60%),var(--bg);
  color:var(--txt);min-height:100vh;font-size:15px;line-height:1.45;
  padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 60px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;box-shadow:var(--shadow)}
.brand h1{font-size:20px;margin:0;line-height:1.1}
.brand .subt{color:var(--mut);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px;position:sticky;top:0;z-index:5;padding:8px 0;background:linear-gradient(var(--bg) 70%,transparent)}
nav.tabs a{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--txt);text-decoration:none;font-size:14px;display:inline-flex;gap:6px;align-items:center}
nav.tabs a i{font-style:normal}
nav.tabs a:hover{border-color:var(--acc)}
nav.tabs a.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);color:var(--txt);padding:8px 13px;border-radius:10px;cursor:pointer;font-size:14px;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600}
.btn.danger:hover{border-color:var(--neg);color:var(--neg)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
select,input{font-family:inherit;font-size:14px;color:var(--txt);background:var(--inp);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
input.num{text-align:right;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:16px;margin:0 0 12px}
.card h3{font-size:14px;margin:14px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld input,.fld select{width:100%}
.fld label{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.fld .h{font-size:11.5px;color:var(--mut);line-height:1.35}
.fld.chk{flex-direction:row;align-items:center;gap:8px}
.fld.chk label{text-transform:none;letter-spacing:0;font-size:13px;color:var(--txt)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:4px 0}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:20px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--mut)}
.kpi.hl{background:linear-gradient(135deg,rgba(108,140,255,.25),rgba(155,108,255,.18)),var(--card2)}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warnc{color:var(--warn)}
.chartbox{position:relative;height:300px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
tr.me td{background:rgba(108,140,255,.12);font-weight:600}
.tablewrap{overflow-x:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mut)} .small{font-size:12px}
.note{font-size:12.5px;color:var(--mut);border-left:3px solid var(--line);padding:4px 10px;margin:10px 0}
.alert{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px;border:1px solid var(--line)}
.alert.warn{border-color:rgba(255,181,71,.7);background:linear-gradient(90deg,rgba(255,181,71,.16),transparent 80%)}
.alert.err{border-color:var(--neg);background:linear-gradient(90deg,rgba(255,92,122,.16),transparent 80%)}
.alert.ok{border-color:rgba(47,208,138,.6);background:linear-gradient(90deg,rgba(47,208,138,.14),transparent 80%)}
.alert.info{border-color:rgba(108,140,255,.6);background:linear-gradient(90deg,rgba(108,140,255,.14),transparent 80%)}
.disc{border:1px solid rgba(255,181,71,.7);background:linear-gradient(90deg,rgba(255,181,71,.18),transparent 85%),var(--card);border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:13.5px}
.disc summary{cursor:pointer;font-weight:600}
.disc p{margin:8px 0 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--card);border:1px solid var(--line);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:50;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{margin-top:36px;color:var(--mut);font-size:12px;text-align:center}
.fspill{border:1px solid var(--line);background:var(--card);color:var(--mut);font-size:12px;padding:3px 10px;border-radius:999px;cursor:pointer;font-family:inherit;display:inline-flex;gap:6px;align-items:center}
.fspill .d{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.fspill.ok{color:var(--pos);border-color:rgba(47,208,138,.45)} .fspill.ok .d{background:var(--pos)}
.fspill.pending .d{background:var(--acc)} .fspill.err{color:var(--neg);border-color:var(--neg)} .fspill.err .d{background:var(--neg)}
.fspill.warn{color:var(--warn);border-color:rgba(255,181,71,.6)} .fspill.warn .d{background:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--mut);padding:7px 11px;font-family:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:600}
section.tab{display:none}
section.tab.on{display:block}
.acc3a{display:grid;grid-template-columns:1fr 160px 110px auto;gap:8px;align-items:center;margin-bottom:8px}
.acc3a input{width:100%}
.srcs{font-size:12px;word-break:break-all}
.srcs li{margin:2px 0}
dialog.modal{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:18px;padding:20px;max-width:520px;width:calc(100% - 32px);box-shadow:var(--shadow)}
dialog.modal::backdrop{background:rgba(5,8,20,.6);backdrop-filter:blur(3px)}
dialog.modal h3{margin:0 0 8px;font-size:17px}
.big{font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
@media (max-width:900px){.g2{grid-template-columns:1fr}}
@media (max-width:640px){
  .wrap{padding:12px 10px 50px}.card{padding:14px;border-radius:14px}
  body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;z-index:20;display:grid;grid-template-columns:repeat(6,1fr);gap:0;
    background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.25)}
  nav.tabs a{flex-direction:column;gap:2px;border:0;background:transparent;padding:4px 1px;font-size:10.5px;border-radius:10px;text-align:center}
  nav.tabs a.on{background:rgba(108,140,255,.18);color:var(--txt)}
  nav.tabs a i{font-size:19px;line-height:1}
  input,select{font-size:16px!important}
  .tools{width:100%;justify-content:space-between}
  .acc3a{grid-template-columns:1fr 96px 52px 34px;gap:6px}.acc3a input{padding:7px 6px}
  .fields{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi .v{font-size:17px}
  .chartbox{height:260px}
}
@media print{nav.tabs,.tools,.btn{display:none!important} section.tab{display:block!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <img class="logo" src="icon-192.png" alt="MP">
      <div><h1>MyPension</h1><div class="subt" data-i18n="subtitle"></div></div>
    </div>
    <div class="tools">
      <button class="fspill" id="fsStatus"><span class="d"></span><span id="fsStatusTxt">…</span></button>
      <div class="seg" id="langSeg"><button data-lang="fr">FR</button><button data-lang="en">EN</button></div>
      <button class="btn sm" id="themeBtn" data-i18n-title="theme">◐</button>
    </div>
  </header>

  <details class="disc" id="disc">
    <summary>⚠️ <span data-i18n="discShort"></span></summary>
    <p data-i18n-html="discLong"></p>
  </details>
  <div id="banners"></div>

  <nav class="tabs" id="tabs">
    <a href="#profil" data-tab="profil"><i>👤</i><span data-i18n="tabProfile"></span></a>
    <a href="#p3a" data-tab="p3a"><i>🏦</i><span data-i18n="tab3a"></span></a>
    <a href="#lpp" data-tab="lpp"><i>🏛️</i><span data-i18n="tabLpp"></span></a>
    <a href="#retrait" data-tab="retrait"><i>📤</i><span data-i18n="tabWithdraw"></span></a>
    <a href="#retraite" data-tab="retraite"><i>🏖️</i><span data-i18n="tabFire"></span></a>
    <a href="#donnees" data-tab="donnees"><i>💾</i><span data-i18n="tabData"></span></a>
  </nav>

  <section class="tab" id="profil">
    <div class="card"><h2 data-i18n="profileTitle"></h2><div id="fProfile"></div>
      <div id="profileOut"></div></div>
  </section>

  <section class="tab" id="p3a">
    <div class="grid g2">
      <div class="card"><h2 data-i18n="p3aTitle"></h2><div id="p3aAccounts"></div>
        <button class="btn sm" id="add3a">＋ <span data-i18n="add3a"></span></button>
        <div id="f3a" style="margin-top:12px"></div></div>
      <div class="card"><h2 data-i18n="p3aResult"></h2><div id="out3a"></div></div>
    </div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><h2 data-i18n="retroTitle"></h2><div id="retroForm"></div><div id="retroOut"></div></div>
      <div class="card"><h2 data-i18n="stagger3aTitle"></h2><div id="stagger3a"></div></div>
    </div>
  </section>

  <section class="tab" id="lpp">
    <div class="grid g2">
      <div class="card"><h2 data-i18n="lppTitle"></h2><div id="fLpp"></div></div>
      <div class="card"><h2 data-i18n="buybackTitle"></h2><div id="outLpp"></div></div>
    </div>
  </section>

  <section class="tab" id="retrait">
    <div class="card"><h2 data-i18n="wdTitle"></h2><div id="fWd"></div><div id="outWd"></div></div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><h2 data-i18n="cantonCmp"></h2><div id="cmpCantons"></div></div>
      <div class="card"><h2 data-i18n="taxMethod"></h2><div id="taxMethod"></div></div>
    </div>
  </section>

  <section class="tab" id="retraite">
    <div class="grid g2">
      <div class="card"><h2 data-i18n="fireTitle"></h2><div id="fFire"></div>
        <div class="row" style="margin-top:10px"><button class="btn sm" data-act="importMW">⤒ <span data-i18n="importMW"></span></button></div></div>
      <div class="card"><h2 data-i18n="fireResult"></h2><div id="outFire"></div></div>
    </div>
    <div class="card" style="margin-top:16px"><h2 data-i18n="fireChart"></h2><div class="chartbox"><canvas id="fireChart"></canvas></div><div id="fireNotes"></div></div>
  </section>

  <section class="tab" id="donnees">
    <div class="grid g2">
      <div class="card"><h2 data-i18n="dataTitle"></h2>
        <p class="small muted" data-i18n="dataLocal"></p>
        <div class="row">
          <button class="btn" data-act="export">⤓ <span data-i18n="exportJson"></span></button>
          <button class="btn" data-act="import">⤒ <span data-i18n="importJson"></span></button>
          <button class="btn" data-act="importMW">⤒ <span data-i18n="importMW"></span></button>
          <button class="btn danger" data-act="reset">↺ <span data-i18n="reset"></span></button>
        </div>
        <p class="small muted" id="lastExportTxt"></p>
        <div id="mwOut"></div>
        <div id="fsPanel"></div>
      </div>
      <div class="card"><h2 data-i18n="paramsTitle"></h2><div id="paramsOut"></div></div>
    </div>
  </section>

  <footer>
    <div><b>MyPension</b> · <span data-i18n="footer"></span> · <a id="privacyLink" href="privacy.html" data-i18n="privacy"></a></div>
    <div id="verTxt" style="margin-top:4px"></div>
  </footer>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="toast" id="toast"></div>

<dialog class="modal" id="firstDlg">
  <h3>MyPension</h3>
  <p data-i18n-html="discLong"></p>
  <div class="row" style="justify-content:flex-end"><button class="btn primary" id="firstOk" data-i18n="understood"></button></div>
</dialog>
<dialog class="modal" id="conflictDlg">
  <h3 data-i18n="cfTitle"></h3>
  <p class="small muted" data-i18n="cfText"></p>
  <div class="row" style="justify-content:flex-end">
    <button class="btn" id="cfKeepLocal" data-i18n="cfKeepLocal"></button>
    <button class="btn primary" id="cfKeepRemote" data-i18n="cfKeepRemote"></button>
  </div>
</dialog>
<dialog class="modal" id="mwDlg">
  <h3 data-i18n="importMW"></h3>
  <div id="mwDlgBody"></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px">
    <button class="btn" id="mwCancel" data-i18n="cancel"></button>
    <button class="btn primary" id="mwApply" data-i18n="apply"></button>
  </div>
</dialog>
<script>

function yp(map, y){ // paramètres de l'année y (cumulés depuis la première année connue)
  const ks = Object.keys(map).map(Number).sort((a,b)=>a-b); let o = {};
  for(const k of ks){ if(k<=y || k===ks[0]) o = Object.assign({}, o, map[k]); }
  return o;
}
function maxParamYear(map){ return Math.max(...Object.keys(map).map(Number)); }
function fmtNum(n, dec=0){
  if(n==null || !isFinite(n)) return "—";
  const neg = n<0; n=Math.abs(n);
  let [i,f] = n.toFixed(dec).split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g,"'");
  return (neg?"-":"")+i+(f?"."+f:"");
}
function chf(n, dec=0){ return n==null||!isFinite(n) ? "—" : "CHF "+fmtNum(n,dec); }
function r100(n){ return Math.round(n/100)*100; }
function pct(x, dec=1){ return fmtNum(x*100,dec)+(LANG==="fr"?" %":"%"); }
function parseNum(str){
  if(typeof str==="number") return str;
  if(str==null) return NaN;
  let s=String(str).trim().replace(/[\s'’`]/g,"").replace(/^CHF/i,"").replace(/%$/,"");
  if(s.indexOf(",")>=0 && s.indexOf(".")<0) s=s.replace(",","."); else s=s.replace(/,/g,"");
  if(s==="") return NaN;
  return Number(s);
}
const MONTHS = { fr:["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."], en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"] };
function toDate(iso){ return iso instanceof Date? iso : new Date(typeof iso==="string" && iso.length===10? iso+"T12:00:00" : iso); }
function fmtDate(iso){
  if(!iso) return "—"; const d=toDate(iso); if(isNaN(d)) return String(iso);
  if(LANG==="en") return d.getDate()+" "+MONTHS.en[d.getMonth()]+" "+d.getFullYear();
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear();
}
function hm(d){ d=toDate(d); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function fmtDT(d){ d=toDate(d); return isNaN(d)? "—" : fmtDate(d)+" "+hm(d); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),2600); }

/* ================= Calculs : profil ================= */
function age(){ return YEAR - S.profile.birthYear; }
function married(){ return S.profile.civil==="married"; }
function relKey(){ return married()? "married" : "single"; }
function refAge(){
  if(S.profile.gender!=="f") return PRM.ahv.referenceAge.men;
  const w=PRM.ahv.referenceAge.women, by=S.profile.birthYear;
  if(by<=1960) return w[1960]; if(by>=1964) return w[1964]; return w[by];
}
function retireAge(){ return clamp(Math.round(S.profile.retireAge||65), Math.max(age(),40), 75); }
function householdIncome(){ return (S.profile.income||0) + (married()? (S.profile.spouseIncome||0) : 0); }
function bvgY(){ return yp(PRM.bvg.byYear, YEAR); }
function coordSalary(g){
  const b=bvgY(); if(!(g>=b.entryThreshold)) return 0;
  return clamp(Math.min(g,b.upperLimit)-b.coordination, b.minCoordinated, b.maxCoordinated);
}
function ageCreditRate(a){ for(const [lo,hi,r] of PRM.bvg.ageCredits) if(a>=lo && a<=hi) return r; return 0; }
function lppEmployeeEstimate(){ return S.profile.status==="employee"? ageCreditRate(age())*coordSalary(S.profile.income)/2 : 0; }
function max3a(y){
  const v=yp(PRM.pillar3a.byYear, y||YEAR);
  if(S.profile.status==="self") return Math.max(0, Math.min(v.large, PRM.pillar3a.largePct*(S.profile.income||0)));
  return v.small;
}
// revenu imposable : valeur de la taxation si fournie, sinon heuristique (étiquetée comme telle)
function taxableIsHeuristic(){ return !(S.profile.taxableOverride>0); }
function taxableBase(){ // avant déduction 3a de l'année
  if(S.profile.taxableOverride>0) return S.profile.taxableOverride + Math.min(S.p3a.contrib||0, max3a());
  const one = g => { if(!(g>0)) return 0; const soc = S.profile.status==="self"? 0.10*g : 0.064*g; return g - soc; };
  let x = one(S.profile.income) - lppEmployeeEstimate();
  if(married()) x += one(S.profile.spouseIncome) - (S.profile.spouseIncome>0? ageCreditRate(age())*coordSalary(S.profile.spouseIncome)/2 : 0);
  return Math.max(0, x*0.88);
}
function taxable(){ return Math.max(0, taxableBase() - Math.min(S.p3a.contrib||0, max3a())); }

/* ================= Calculs : impôts (tableaux ESTV précalculés) ================= */
function interp(xs, rows, x){ // rows : [[fed, cc], ...] → {fed, cc}
  if(!(x>0)) return {fed:0, cc:0};
  const f = i => ({fed:rows[i][0], cc:rows[i][1]});
  if(x<=xs[0]){ const a=f(0), k=x/xs[0]; return {fed:a.fed*k, cc:a.cc*k}; }
  for(let i=1;i<xs.length;i++){
    if(x<=xs[i]){ const a=f(i-1), b=f(i), k=(x-xs[i-1])/(xs[i]-xs[i-1]); return {fed:a.fed+(b.fed-a.fed)*k, cc:a.cc+(b.cc-a.cc)*k}; }
  }
  const n=xs.length-1, a=f(n-1), b=f(n), k=(x-xs[n])/(xs[n]-xs[n-1]); // extrapolation au taux marginal du dernier segment
  return {fed:b.fed+(b.fed-a.fed)*k, cc:b.cc+(b.cc-a.cc)*k};
}
function cantonData(){ return TX.cantons[S.profile.canton] || TX.cantons.ZH; }
function capTax(amount, ct){ const c=ct? TX.cantons[ct] : cantonData(); const r=interp(TX.capitalGrid, c.cap[relKey()], amount); r.total=r.fed+r.cc; return r; }
function incTax(x){ const r=interp(TX.incomeGrid, cantonData().inc[relKey()], x); r.total=r.fed+r.cc; return r; }
function deductionSaving(ded, base){ base = base==null? taxable() : base; return incTax(base).total - incTax(Math.max(0, base-ded)).total; }
function marginalRate(base){ base = base==null? taxable() : base; return deductionSaving(1000, base)/1000; }
// fourchette indicative : ±10 % (chef-lieu) ou ±20 % (autre commune) sur la part canton+commune, ±3 % sur l'IFD
function band(r){
  const otherCommune = S.profile.commune && S.profile.commune.trim().toLowerCase()!==cantonData().capital.toLowerCase();
  const w = otherCommune? 0.20 : 0.10;
  return { lo: r.fed*0.97 + r.cc*(1-w), hi: r.fed*1.03 + r.cc*(1+w), w };
}
function rangeTxt(r){ const b=band(r); return chf(r100(b.lo))+" – "+fmtNum(r100(b.hi)); }

/* ================= Calculs : 3a ================= */
function sum3a(){ return S.p3a.accounts.reduce((s,a)=>s+(+a.balance||0),0); }
function earliest3a(){ return Math.ceil(refAge() - PRM.pillar3a.withdrawYearsBeforeRef); }
function latest3a(){ return Math.floor(refAge() + PRM.pillar3a.withdrawYearsAfterRef); }
function default3aAges(){
  const n=S.p3a.accounts.length, R=retireAge(), lo=earliest3a(), hi=Math.max(Math.ceil(refAge()), Math.min(R, latest3a()));
  const last=clamp(R, lo, hi);
  return S.p3a.accounts.map((a,i)=> clamp(last-(n-1-i), lo, hi));
}
function w3aAges(){ const d=default3aAges(); return S.p3a.accounts.map((a,i)=> { const v=S.wd.ages[i]; return v? clamp(v, earliest3a(), latest3a()) : d[i]; }); }
// valeur d'un compte 3a à l'âge A (cotisation répartie également entre les comptes, tant que l'on travaille)
function proj3aAccount(i, A, opts){
  opts=opts||{}; const n=S.p3a.accounts.length, r=(S.p3a.ret||0)/100, stop=opts.stop||retireAge();
  let v=+S.p3a.accounts[i].balance||0;
  const c=Math.min(S.p3a.contrib||0, max3a())/n;
  for(let a=age(); a<A; a++){ v*=1+r; if(a<stop && a<latest3a()) v+=c; if(a===age() && i===0) v+=(S.p3a.retro||0); }
  return v;
}
function proj3aTotal(A, opts){ return S.p3a.accounts.reduce((s,_,i)=>s+proj3aAccount(i,A,opts),0); }
function retroGaps(){
  const out=[]; if(YEAR < PRM.pillar3a.retroFirstYear) return out;
  const from=Math.max(PRM.pillar3a.retroGapFromYear, YEAR-PRM.pillar3a.retroMaxYearsBack);
  for(let y=from; y<YEAR; y++){ const mx=max3a(y), paid=+(S.p3a.paid[y]||0); out.push({y, mx, paid, gap:Math.max(0, mx-paid)}); }
  return out;
}
function retroMax(){ const g=retroGaps().reduce((s,x)=>s+x.gap,0); return Math.min(g, yp(PRM.pillar3a.byYear,YEAR).small); }

/* ================= Calculs : LPP ================= */
function lppCredit(a){ if(S.lpp.credits>0) return S.lpp.credits; return S.profile.status==="employee"? ageCreditRate(a)*coordSalary(S.profile.income) : 0; }
function lppProj(A, opts){
  opts=opts||{}; const i=(S.lpp.interest||0)/100, stop=opts.stop||retireAge(), withBuy=opts.buyback!==false;
  const k=Math.max(1, Math.round(S.lpp.buybackYears||1));
  let base=+S.lpp.balance||0, buy=0;
  for(let a=age(); a<A; a++){
    base*=1+i; buy*=1+i;
    if(a<stop) base+=lppCredit(a);
    if(withBuy && a-age()<k) buy+=(S.lpp.buyback||0)/k;
  }
  if(S.lpp.projected>0 && !opts.raw){ // calibrage sur le capital projeté du certificat (à l'âge de référence, cotisations jusque-là)
    const ref=Math.round(refAge()), calc=lppProj(ref, {stop:ref, buyback:false, raw:true});
    if(calc>0){ const f=S.lpp.projected/calc; if(isFinite(f) && f>0.3 && f<3) base*=f; }
  }
  return base+buy;
}
function lppAccessAge(stop){
  const ref=refAge(), early=PRM.bvg.earliestEarlyRetirement;
  if(stop<early) return {age:Math.ceil(ref-5), vested:true};
  if(stop<=ref) return {age:stop, vested:false};
  return {age:Math.min(stop, Math.floor(ref+5)), vested:false};
}

/* ================= Calculs : AVS ================= */
function avsMonthlyFull(ram){
  const a=yp(PRM.ahv.byYear, YEAR), f=PRM.ahv.formula, m=a.minMonthly;
  if(ram<=f.minMultiple*m) return m;
  if(ram>=f.maxMultiple*m) return a.maxMonthly;
  const v = ram<=f.kneeMultiple*m ? f.lowFactor*m + f.lowSlope*ram : f.highFactor*m + f.highSlope*ram;
  return clamp(v, m, a.maxMonthly);
}
function avsAnnual(){ // ménage, CHF/an, 13e rente comprise
  const a=yp(PRM.ahv.byYear, YEAR), months = YEAR>=PRM.ahv.thirteenthFrom? 13 : 12;
  if(S.fire.avsOverride>0) return {annual:S.fire.avsOverride*months, monthly:S.fire.avsOverride, override:true, months};
  const scale = clamp((PRM.ahv.fullYears-(S.fire.avsMissing||0))/PRM.ahv.fullYears, 0, 1);
  let monthly;
  if(married()){ // splitting simplifié : moyenne des deux revenus pour chaque conjoint
    const ram=(S.profile.income+(S.profile.spouseIncome||0))/2;
    monthly=Math.min(2*avsMonthlyFull(ram)*scale, PRM.ahv.coupleCapPct*a.maxMonthly);
  } else monthly=avsMonthlyFull(S.profile.income)*scale;
  return {annual:monthly*months, monthly, override:false, months, capped: married() && 2*avsMonthlyFull((S.profile.income+(S.profile.spouseIncome||0))/2)*scale > PRM.ahv.coupleCapPct*a.maxMonthly};
}

/* ================= Retraits en capital : plan ================= */
function withdrawalPlan(stop){
  stop = stop||retireAge();
  const ev=[], ages=w3aAges();
  S.p3a.accounts.forEach((a,i)=> ev.push({label:a.name||("3a "+(i+1)), kind:"3a", age:ages[i], amount:proj3aAccount(i, ages[i], {stop})}));
  const acc=lppAccessAge(stop), share = acc.vested? 1 : clamp((S.lpp.capitalShare||0)/100,0,1);
  const lppCap=lppProj(acc.age, {stop});
  if(share>0) ev.push({label:t(acc.vested? "lppVestedLbl" : "lppCapLbl"), kind:"lpp", age:acc.age, amount:lppCap*share});
  if(S.wd.other>0) ev.push({label:t("otherCapLbl"), kind:"other", age:S.wd.otherAge||stop, amount:S.wd.other});
  return {ev, lppCap, share, acc};
}
function groupByAge(ev){ const m={}; ev.forEach(e=>{ m[e.age]=(m[e.age]||0)+e.amount; }); return Object.keys(m).map(Number).sort((a,b)=>a-b).map(a=>({age:a, amount:m[a], tax:capTax(m[a])})); }

/* ================= Retraite / FIRE : simulation annuelle (CHF d'aujourd'hui) ================= */
function simulate(stop, o){
  o=o||{}; const F=S.fire, rd=o.retDelta||0;
  const rPre=(F.retPre||0)/100+rd, rPost=(F.retPost||0)/100+rd, infl=(F.infl||0)/100;
  const plan=withdrawalPlan(stop), groups=groupByAge(plan.ev);
  const capByAge={}; groups.forEach(g=>capByAge[g.age]=g);
  const ages3=w3aAges(), ref=refAge(), avs=avsAnnual().annual;
  const rente = plan.acc.vested? 0 : plan.lppCap*(1-plan.share)*(S.lpp.conv||0)/100;
  let L=+F.otherAssets||0, minL=Infinity, failAge=null, rows=[], taxes=0;
  for(let a=age(); a<=F.horizon; a++){
    if(a===stop && o.extra) L+=o.extra;
    const working=a<stop;
    let v3=0; S.p3a.accounts.forEach((_,i)=>{ if(a<ages3[i]) v3+=proj3aAccount(i,a,{stop}); });
    const vL = a<plan.acc.age? lppProj(a,{stop}) : 0;
    let inc=0, out=0;
    if(capByAge[a]){ inc+=capByAge[a].amount-capByAge[a].tax.total; taxes+=capByAge[a].tax.total; }
    const avsY = a+1<=ref? 0 : avs*Math.min(1, a+1-ref);
    const lppY = a>=plan.acc.age? rente/Math.pow(1+infl, a-plan.acc.age) : 0; // rente LPP non indexée → perd en valeur réelle
    if(working) inc+=(F.monthlySavings||0)*12; else { inc+=avsY+lppY; out=F.spending||0; }
    rows.push({a, L:Math.max(L,0), v3, vL, avsY, lppY, out, Lraw:L});
    L = L*(1+(working?rPre:rPost)) + inc - out;
    if(!working){ if(L<minL) minL=L; if(L<0 && failAge==null) failAge=a; }
  }
  return {ok: failAge==null, failAge, minL, rows, plan, rente, avs, taxes, stop};
}
function earliestStop(o){ for(let s=Math.max(age(),45); s<=70; s++){ if(simulate(s,o).ok) return s; } return null; }
function gapAt(stop){ // capital supplémentaire nécessaire (>0) ou marge (<0) à l'âge d'arrêt
  if(simulate(stop).ok){ let lo=0, hi=5e7; if(simulate(stop,{extra:-hi}).ok) return -hi;
    for(let i=0;i<40;i++){ const m=(lo+hi)/2; if(simulate(stop,{extra:-m}).ok) lo=m; else hi=m; } return -lo; }
  let lo=0, hi=1e8; if(!simulate(stop,{extra:hi}).ok) return Infinity;
  for(let i=0;i<40;i++){ const m=(lo+hi)/2; if(simulate(stop,{extra:m}).ok) hi=m; else lo=m; } return hi;
}
/* ================= Champs de formulaire ================= */
const CANTONS = () => Object.keys(TX.cantons).map(k=>[k, k+" – "+TX.cantons[k].name]);
function fld(k, type, lbl, opts){ return Object.assign({k, type, lbl}, opts||{}); }
function fieldsHTML(list){
  return `<div class="fields">`+list.map(f=>{
    const v=getK(f.k), help=f.help? `<span class="h">${typeof f.help==="function"? f.help() : t(f.help)}</span>` : "";
    if(f.type==="chk") return `<div class="fld chk"><input type="checkbox" id="f_${f.k}" data-k="${f.k}" data-t="chk" ${v?"checked":""}><label for="f_${f.k}">${esc(t(f.lbl))}</label></div>`;
    let inp;
    if(f.type==="sel"){ const op=typeof f.options==="function"? f.options() : f.options;
      inp=`<select id="f_${f.k}" data-k="${f.k}" data-t="sel">`+op.map(([val,l])=>`<option value="${esc(val)}" ${String(v)===String(val)?"selected":""}>${esc(f.raw? l : t(l))}</option>`).join("")+`</select>`; }

const MW_FX_FALLBACK={CHF:1, EUR:0.927, USD:0.824, GBP:1.099};
function isMyWealth(j){ return !!j && typeof j==="object" && Array.isArray(j.accounts) && Array.isArray(j.positions); }
function myWealthTotals(j){
  const rates=Object.assign({CHF:1}, (j.fx && j.fx.rates)||{});
  const rate=c=>{ const r=+rates[c]; return r>0? r : (MW_FX_FALLBACK[c]||NaN); }; // CHF par unité de devise
  let pv=0, other=0, nA=0, nP=0, unknown=new Set();
  j.accounts.forEach(a=>{ nA++; (a.balances||[]).forEach(b=>{ const r=rate(b.cur); if(!isFinite(r)){ unknown.add(b.cur); return; } const v=(+b.amount||0)*r; if(a.category==="prevoyance") pv+=v; else other+=v; }); });
  j.positions.forEach(p=>{ nP++; const px=(+p.price>0? +p.price : +p.avg||0), r=rate(p.currency||"CHF"); if(!isFinite(r)){ unknown.add(p.currency); return; } other+=(+p.qty||0)*px*r; });
  return {pv, other, nA, nP, unknown:[...unknown]};
}

/* ================= Synchronisation Dropbox (facultative, OAuth PKCE, dossier « Applications/<app> ») =================
   Repris de MyWealth (même logique PKCE / jetons / lecture / écriture conditionnelle). */
const REMOTE_NAME="mypension-data.json", CLOUD_KEY="mypension.cloud", DBX_KEY="mypension.dropbox", DBX_PKCE="mypension.dropbox.pkce";
const APP_BASE=new URL("./", location.href).href;
function loadCloud(){ try{ return Object.assign({on:false, etag:null, dirty:false, lastSync:null, lastBackupMonth:null}, JSON.parse(localStorage.getItem(CLOUD_KEY)||"{}")); }catch(e){ return {on:false}; } }
let C=loadCloud();
function saveCloud(){ try{ localStorage.setItem(CLOUD_KEY, JSON.stringify(C)); }catch(e){} }
const SYNC={state:"off", err:null, timer:null, busy:false, again:false};
function httpErr(r,extra){ const e=new Error("HTTP "+r.status+(extra?" – "+extra:"")); e.status=r.status; return e; }
function reauthErr(key){ const x=new Error(t(key)); x.reauth=true; return x; }
function b64url(bytes){ return btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function randStr(n){ const a=new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); }
const DropboxP={
  label:"Dropbox", tok:null, ready:false,
  configured(){ return !!cfg().DROPBOX_APP_KEY; },
  load(){ try{ this.tok=JSON.parse(localStorage.getItem(DBX_KEY)||"null"); }catch(e){ this.tok=null; } },
  store(){ try{ this.tok? localStorage.setItem(DBX_KEY,JSON.stringify(this.tok)) : localStorage.removeItem(DBX_KEY); }catch(e){} },
  async init(){
    if(!this.configured() || this.ready) return;
    this.load();
    const q=new URLSearchParams(location.search);
    if(q.get("code") && q.get("state")){
      let p=null; try{ p=JSON.parse(localStorage.getItem(DBX_PKCE)||"null"); }catch(e){}
      history.replaceState(null,"",APP_BASE+location.hash);
      if(p && p.state===q.get("state")){
        localStorage.removeItem(DBX_PKCE);
        const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
          body:new URLSearchParams({code:q.get("code"),grant_type:"authorization_code",client_id:cfg().DROPBOX_APP_KEY,redirect_uri:APP_BASE,code_verifier:p.verifier})});
        if(!r.ok) throw httpErr(r,t("errDbxRefused"));
        const j=await r.json();
        this.tok={refresh:j.refresh_token, access:j.access_token, exp:Date.now()+(j.expires_in||14400)*1000, account:null};
        this.store(); C.on=true; C.etag=null; C.dirty=S.meta.touched; saveCloud();
        try{ const a=await this.api("users/get_current_account"); this.tok.account=a.email||(a.name&&a.name.display_name)||""; this.store(); }catch(e){}
      }
    } else if(q.get("error") && localStorage.getItem(DBX_PKCE)){
      localStorage.removeItem(DBX_PKCE); history.replaceState(null,"",APP_BASE); toast(t("dbxCancelled"));
    }
    this.ready=true;
  },
  signedIn(){ return !!(this.tok && this.tok.refresh); },
  accountName(){ return (this.tok && this.tok.account) || ""; },
  async login(){
    const verifier=randStr(48), state=randStr(16);
    const challenge=b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
    localStorage.setItem(DBX_PKCE, JSON.stringify({verifier,state}));
    location.href="https://www.dropbox.com/oauth2/authorize?"+new URLSearchParams({client_id:cfg().DROPBOX_APP_KEY,response_type:"code",
      code_challenge:challenge,code_challenge_method:"S256",token_access_type:"offline",redirect_uri:APP_BASE,state});
  },
  async logout(){
    try{ if(this.tok) await fetch("https://api.dropboxapi.com/2/auth/token/revoke",{method:"POST",headers:{Authorization:"Bearer "+(await this.token())}}); }catch(e){}
    this.tok=null; this.store();
  },
  async token(){
    if(!this.signedIn()) throw reauthErr("errNotConnected");
    if(this.tok.access && Date.now() < this.tok.exp-60000) return this.tok.access;
    const r=await fetch("https://api.dropboxapi.com/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({grant_type:"refresh_token",refresh_token:this.tok.refresh,client_id:cfg().DROPBOX_APP_KEY})});
    if(r.status===400||r.status===401) throw reauthErr("errDbxRevoked");
    if(!r.ok) throw httpErr(r);
    const j=await r.json(); this.tok.access=j.access_token; this.tok.exp=Date.now()+(j.expires_in||14400)*1000; this.store();
    return this.tok.access;
  },
  async api(path){ const r=await fetch("https://api.dropboxapi.com/2/"+path,{method:"POST",headers:{Authorization:"Bearer "+await this.token()}}); if(!r.ok) throw httpErr(r); return r.json(); },
  async read(name){
    const r=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:{Authorization:"Bearer "+await this.token(),"Dropbox-API-Arg":JSON.stringify({path:"/"+name})}});
    if(r.status===409){ const tx=await r.text(); if(/not_found/.test(tx)) return null; throw httpErr(r,tx.slice(0,120)); }
    if(r.status===401) throw reauthErr("errSession");
    if(!r.ok) throw httpErr(r);
    let meta={}; try{ meta=JSON.parse(r.headers.get("Dropbox-API-Result")||"{}"); }catch(e){}
    return {text:await r.text(), etag:meta.rev||null};
  },
  async write(name,text,etag){ // etag : rev = n'écrit que si inchangé ; null = création ; "*" = écrase
    const mode = etag===null? "add" : etag==="*"? "overwrite" : {".tag":"update", update:etag};
    const r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:{Authorization:"Bearer "+await this.token(),
      "Content-Type":"application/octet-stream","Dropbox-API-Arg":JSON.stringify({path:"/"+name,mode,autorename:false,mute:true})},body:new Blob([text])});
    if(r.status===409){ const tx=await r.text(); if(/conflict/.test(tx)) return {conflict:true}; throw httpErr(r,tx.slice(0,120)); }
    if(r.status===401) throw reauthErr("errSession");
    if(!r.ok) throw httpErr(r);
    const j=await r.json(); return {etag:j.rev};
  }
};
function cloudOn(){ return DropboxP.configured() && DropboxP.ready && DropboxP.signedIn(); }
function setSync(st,err){ SYNC.state=st; if(err!==undefined) SYNC.err=err; renderSyncUI(); }
function askConflict(){
  return new Promise(res=>{ const dlg=$("conflictDlg"); const done=v=>{ dlg.close(); res(v); };
    $("cfKeepRemote").onclick=()=>done("remote"); $("cfKeepLocal").onclick=()=>done("local"); dlg.oncancel=e=>e.preventDefault(); dlg.showModal(); });
}
function adopt(j){ S=migrate(j); lastKey=dataKey(S); writeLocal(); applyTheme(); renderAll(true); showTab(); }
async function pushNow(etag){
  const txt=fileText(), r=await DropboxP.write(REMOTE_NAME, txt, etag);
  if(r.conflict) return false;
  C.etag=r.etag; C.dirty=false; C.lastSync=new Date().toISOString(); saveCloud();
  const m=today().slice(0,7);
  if(C.lastBackupMonth!==m){ try{ await DropboxP.write("mypension-data-"+m+".json", txt, "*"); C.lastBackupMonth=m; saveCloud(); }catch(e){ console.warn(e); } }
  return true;
}
async function syncNow(){
  if(!cloudOn()){ setSync("off"); return; }
  if(!navigator.onLine){ setSync("offline"); return; }
  if(SYNC.busy){ SYNC.again=true; return; }
  SYNC.busy=true; clearTimeout(SYNC.timer); SYNC.timer=null; setSync("syncing");
  try{
    const remote=await DropboxP.read(REMOTE_NAME);
    if(!remote){ if(!(await pushNow(C.etag? "*" : null))) SYNC.again=true; }
    else{
      let j=null; try{ j=JSON.parse(remote.text); }catch(e){}
      if(!isMPData(j)) throw new Error(t("errUnreadable",{name:REMOTE_NAME}));
      const same = dataKey(migrate(j))===dataKey(S);
      if(same){ C.etag=remote.etag; C.dirty=false; C.lastSync=new Date().toISOString(); saveCloud(); }
      else if(remote.etag===C.etag){ if(C.dirty){ if(!(await pushNow(remote.etag))) SYNC.again=true; } }
      else if(!C.dirty || !S.meta.touched){ adopt(j); C.etag=remote.etag; C.dirty=false; C.lastSync=new Date().toISOString(); saveCloud(); toast(t("loadedFrom")); }
      else{ const k=await askConflict(); if(k==="remote"){ adopt(j); C.etag=remote.etag; C.dirty=false; C.lastSync=new Date().toISOString(); saveCloud(); } else if(!(await pushNow(remote.etag))) SYNC.again=true; }
    }
    setSync("ok", null);
  }catch(e){
    console.warn("sync failed", e);
    if(e.reauth) setSync("reauth", e); else if(!navigator.onLine || e instanceof TypeError) setSync("offline", e); else setSync("error", e);
  }finally{ SYNC.busy=false; if(SYNC.again){ SYNC.again=false; setTimeout(syncNow, 400); } }
}
function Cloud_schedule(){ C.dirty=true; saveCloud(); if(!cloudOn()) return; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(syncNow, 2000); if(!SYNC.busy) setSync("pending"); }
async function Cloud_init(){
  if(!DropboxP.configured()){ setSync("off"); return; }
  try{ await DropboxP.init(); }catch(e){ console.warn(e); setSync(navigator.onLine? "error" : "offline", e); return; }
  if(DropboxP.signedIn()) await syncNow(); else setSync("off");
}
async function Cloud_logout(){
  if(!confirm(t("confirmLogout"))) return;
  await DropboxP.logout(); C=Object.assign(loadCloud(),{on:false, etag:null}); saveCloud(); setSync("off");
}
window.addEventListener("online", ()=>{ if(cloudOn()) syncNow(); });
window.addEventListener("offline", ()=>{ if(cloudOn()) setSync("offline"); });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden" && SYNC.timer){ clearTimeout(SYNC.timer); syncNow(); } });
function renderSyncUI(){

  if(on && st==="ok"){ cls="ok"; tx=t("stSynced")+(C.lastSync? " "+hm(C.lastSync) : ""); }
  else if(on && (st==="pending"||st==="syncing")){ cls="pending"; tx=t("stSyncing"); }
  else if(st==="offline"){ cls="warn"; tx=t("stOffline"); }
  else if(st==="reauth"){ cls="warn"; tx=t("stReauth"); }
  else if(st==="error"){ cls="err"; tx=t("stError"); }

  $("fsStatus").className="fspill "+cls; $("fsStatusTxt").textContent=tx;
  let body;
  if(!DropboxP.configured()) body=`<p class="small muted" style="margin:0">${t("cloudNotConfigured")}</p>`;
  else if(on) body=`<p class="small muted" style="margin:0 0 8px">${t("connectedTo",{a:esc(DropboxP.accountName())})} <code>Apps › … › ${REMOTE_NAME}</code><br>${t("lastSync")} ${C.lastSync? fmtDT(C.lastSync) : "—"}${SYNC.err&&st==="error"? "<br>⚠ "+esc(SYNC.err.message) : ""}</p>
     <div class="row"><button class="btn" data-cl="sync">⟳ ${t("syncNow")}</button><button class="btn sm danger" data-cl="logout">${t("logout")}</button></div>`;
  else body=`<p class="small muted" style="margin:0 0 8px">${t("cloudPitch")}</p><button class="btn primary" data-cl="login">${t("loginDropbox")}</button>`;
  $("fsPanel").innerHTML=`<div class="alert info" style="margin-top:14px"><b>☁️ ${t("cloudSync")}</b><br>${body}</div>`;
}
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-cl]"); if(!b) return;
  const a=b.dataset.cl;
  if(a==="login") DropboxP.login().catch(err=>alert(err.message));
  else if(a==="sync") syncNow(); else if(a==="logout") Cloud_logout();
});
$("fsStatus").onclick=()=>{ if(SYNC.state==="reauth") DropboxP.login(); else location.hash="#donnees"; };

/* ================= Démarrage ================= */
applyTheme(); applyI18n(); lastKey=dataKey(S);
renderAll(true); showTab();
if(!S.meta.disclaimerOk){ $("firstDlg").showModal(); }
$("firstOk").onclick=()=>{ S.meta.disclaimerOk=true; writeLocal(); lastKey=null; $("firstDlg").close(); };
Cloud_init();
if("serviceWorker" in navigator && location.protocol!=="file:") navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW", e));
</script>
</body>
</html>
